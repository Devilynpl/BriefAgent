name: BriefAgent Autonomous Research Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  agent-quality-gate:
    name: Evaluate BriefAgent Quality Gate (JudgeKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout BriefAgent Repository
        uses: actions/checkout@v4

      - name: Checkout JudgeKit (Central LLMOps Infrastructure)
        uses: actions/checkout@v4
        with:
          repository: Devilynpl/TheJudge
          path: judgekit_repo

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install BriefAgent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install JudgeKit
        run: |
          pip install -e judgekit_repo/

      - name: Run Continuous Agent Evaluation & CI Quality Gate
        run: |
          python -m judgekit.cli_runner \
            --target tests/evals/agent_eval_adapter.py:BriefAgentTargetAdapter \
            --suite tests/evals/benchmark_25_companies.jsonl \
            --gate-config .github/gate_config.json \
            --output artifacts/eval_agent_candidate.json

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: artifacts/
