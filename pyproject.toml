[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "briefagent"
version = "0.1.0"
description = "Deterministyczny Agent Badawczy z Maszyną Stanów, Hard Budgets i Trace'ami"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BriefAgent Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "dnspython>=2.4.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
